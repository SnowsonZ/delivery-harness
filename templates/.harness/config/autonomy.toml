# 自治等级与放权规则：机器按路径与 trailer 判定的类别，各自的自治等级与误差预算。
# 只有用户能放权：改动本文件属 R3，升级时附周报中的证据。
# 降级是自动的：误差预算超支、PR 带 budget-exceeded 标签时，policy 在下一次判定即时转用户评审。
# 停机不靠本文件：Disable workflow 后再运行 python .harness/engine/cli.py automerge-off
# 撤销已开启的自动合并（顺序见 README「Platform setup」）。
# 新接入的项目全部从人审开始（L3），攒够数据后再逐类放权。
#
# R2 合同制路径（可选，设计 docs/plans/2026-10-03-autonomy-trial-design.md 第 4 节）：R2 实现 PR
# 同时满足六个条件才自动合并——
#   1. 合同已批：任务书已在 main 上（不随本 PR 修改）且声明的类别与机器判定一致，本 PR 全部改动
#      路径都在下方 [contract_route] allowed 白名单内；
#   2. 运行记录合格（run_check 全部判定通过）；
#   3. 机器判定类别在上表 [classes] 中为 L4，且未超误差预算；
#   4. agent_login 写的独立评审标记（verdict 通过、无严重级发现、head 内容相同）；
#   5. agent_login 写的设计方复核标记（verdict 通过、定向变异数 ≥ 1 且全部抓住、head 内容相同）；
#   6. 规模不超过 [size] max_lines。
# 评审模型与执行模型同家（或任一方未知）时按降级处理：合并照常，但强制开 audit 议题。
# 白名单只列实现路径（黑名单总会漏掉某个路径；任务书、规格、AGENTS.md、护栏一律不在其中），
# 按项目目录调整后取消注释启用；[contract_route] 缺失或 allowed 为空时，没有任何 PR 走这条路径。
# [contract_route]
# allowed = ["src/**", "tests/**", "docs/runs/**", "CHANGELOG.md"]

[size]
# 增删行数（不计下列路径）超过阈值的 PR 不自动合并，转用户并提示拆分。
max_lines = 400
exclude = ["tests/golden/**", "docs/runs/**"]

# 机器按路径、trailer 判定的类别（policy.py machine_class），不是任务书的声明。
# level：L4 = 门禁全绿后自动合并；L3 及以下 = 用户评审。
# window / max_escapes：该类最近 window 次合并中，escape 议题（带 class:<类别> 标签）超过 max_escapes 即停该类自动合并。
[classes.K0]
name = "合同（业务与缺陷类任务书）"
level = "L3"
window = 20
max_escapes = 1

[classes.K1]
name = "说明与记录"
level = "L3"
window = 20
max_escapes = 1

[classes.K2]
name = "补测试"
level = "L3"
window = 20
max_escapes = 1

[classes.K3]
name = "行为不变重构（R1）"
level = "L3"
window = 10
max_escapes = 0
# 抽样审计：按 PR 编号哈希每 audit_every 个抽 1 个，合并后自动开 audit 议题。
# 满 10 个抽审无问题后由用户在此降低比例（改大 audit_every）。
audit_every = 3

[classes.K4]
name = "缺陷修复"
level = "L3"

[classes.K5]
name = "功能与规格实现"
level = "L3"

[classes.K6]
name = "界面与组件"
level = "L3"

[classes.K7]
name = "护栏与流程"
level = "L3"

[classes.K8]
name = "发版"
level = "L2"
