# delivery-harness 项目配置：身份、运行时、源码与语言、verify 检查清单、发版、变异目标。
# 改动本文件属于 R3（护栏本身），由用户批准。
schema = 1

[identity]
# 必填：执行方与 Agent 推送、开 PR、评论使用的 GitHub 账号（与仓库所有者不同，合并须由非推送者批准）。
# agent_login = ""
# 可选：提交邮箱，缺省为 <login>@users.noreply.github.com。
# agent_email = ""

[platform]
# 自动合并的批准方式（.github/workflows/auto-merge.yml 读取；ruleset 见 .github/rulesets/）：
#   "app"（默认）  两个账号：Agent 用单独的 GitHub 账号，自动合并的 PR 由批准 App 批准。
#   "none"         单账号：ruleset 不要求批准，用 GITHUB_TOKEN 合并；此时 [identity] agent_login 填你自己的账号，
#                  风险见 SECURITY.md「Single-account mode」。
# approval = "app"
# 批准 App 的仓库变量名（App 的 client id）、密钥名与放密钥的 environment 名；缺省如下，仅在与现有命名冲突时改。
# app_client_id_var = "HARNESS_APP_CLIENT_ID"
# app_private_key_secret = "HARNESS_APP_PRIVATE_KEY"
# 同步 App（专管落后分支的同步，与批准 App 分开：ruleset 要求最后一次推送由推送者以外的人批准，
# 批准 App 不能既同步又批准）。它需要 Contents 写与 Pull requests 写权限；变量与密钥缺省名如下。
# 未配置时工作流不同步落后分支，只在 PR 上评论提示人工同步。
# sync_app_client_id_var = "HARNESS_SYNC_APP_CLIENT_ID"
# sync_app_private_key_secret = "HARNESS_SYNC_APP_PRIVATE_KEY"
# environment = "harness-auto-merge"

[runtime]
# 可选：bin/harness 与 git 钩子优先使用的解释器（相对仓库根），缺省用 PATH 上的 python3。
# python = ".venv/bin/python"
# 派发槽位清理未跟踪文件时保留、并以符号链接指向主目录的路径（如本地虚拟环境）。
preserve = []

[sources]
# 产品代码（R1 判定只看这些路径）。
code = []
# UI 代码：改动不自动合并。
ui = []
# 质量棘轮：Python 目录（ruff C901 与体量）、Swift 目录（轻量解析）。
python_dirs = []
swift_dirs = []

[verify]
# 锁定版本的 Python 工具（在 requirements 文件中写 tool==版本）。
requirements = "requirements-dev.txt"
pinned_tools = []
# 检查顺序：引擎检查（tools、hygiene、quality、docs、acceptance、taskbook、integrity、replay）与下面的项目检查混排。
order = []

# 项目检查：name、tiers（quick/default/full）、command（`{python}` 换成当前解释器）或 shell、requires = "macos"。
# [[verify.checks]]
# name = "lint"
# tiers = ["quick", "default", "full"]
# command = ["{python}", "-m", "ruff", "check", "."]
#
# [[verify.checks]]
# name = "tests"
# command = ["{python}", "-m", "unittest", "discover", "-s", "tests"]

# 事件与审计（可观测性，可选）。库与产物在 git 公共目录（.git/harness/），不入库、不上传。
# [events]
# enabled = true   # false 关闭事件写入；环境变量 HARNESS_EVENTS=off 优先于本配置。缺省开启。
# artifact_days = 30  # 本机产物保留天数，缺省 30；非法或非正整数提示一次并按 30 处理。
#                     # 每天首次 emit 顺带清理到期的内容寻址产物文件与索引、终止运行的派发原始流；
#                     # 事件、引用与锚点永不因保留期删除。

# audit 命令的完整性与防篡改规则（可选）。缺省即下列缺省值（按设计规则执行）；未知键、类型或取值
# 非法报告 configuration_error 并以退出码 2 结束，不静默放宽。只影响 audit 报告，不进入原判定。
# [audit]
# require_review_risk = 2            # 风险 ≥ 该等级（0..3）必须有独立评审且评审者身份不同。
# require_route_for_auto = true      # 自动合并必须有受信任 CI 来源（ci: 前缀）的 route.result（auto_merge=true）。
# require_run_record_for_task = true # 任务 PR 必须有运行记录与阶段锚点（设计方 PR 豁免派发记录）。
# verify_anchors = true              # 核对固定锚点与对应前缀链头（合法追加不误报，删尾/改中可发现）。

# [release]
# version_file = "src/version.py"
# short_version_var = "VERSION"

# [[mutation.targets]]
# name = "关键函数"
# file = "src/module.py"
# functions = ["fn"]
# tests = ["test_module"]

# 交付度量与周报并列的历史基线（可选）：label 显示在「<label> 基线：」前。
# [metrics.baseline]
# label = "v1.0"
# values = { "评审轮次" = 5 }
