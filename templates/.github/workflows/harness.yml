name: harness

# 每个 PR 与 main 上的机器判定：verify（项目检查取自 .harness/config/checks.toml）、卫生、基线测试、
# 风险等级、运行记录、修复证据、交付度量。风险等级与证据由机器生成，写入 job summary。
# 本文件安装后归项目所有：依赖安装、操作系统矩阵等按项目需要改（改动属于 R3）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # job 名 `harness` 是 ruleset 要求的状态检查名（.github/rulesets/*.json）；改名须同步。
  harness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # 交付度量读取本分支的运行记录（CI 轮次）
      pull-requests: read  # 合并后事实同步读取 PR、评审与标签（设计 3.5）
      issues: read  # 合并后事实同步读取 audit 与 escape 议题
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # 项目自己的依赖与工具链（verify 的项目检查要用）。按需替换；只有引擎自身不需要任何依赖。
      - name: Prepare project
        run: |
          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt; fi

      - name: Resolve base
        id: base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          case "$base" in ""|0000000000000000000000000000000000000000) base=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD) ;; esac
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Verify
        run: python .harness/engine/cli.py verify --full

      - name: Hygiene of changes
        run: python .harness/engine/cli.py hygiene --range "${{ steps.base.outputs.sha }}"

      # 已有判定器以 base 为准：追加或新增的测试代码不能让已有测试失效。
      - name: Existing tests (base version) on head
        if: github.event_name == 'pull_request'
        run: python .harness/engine/cli.py base-tests --base "${{ steps.base.outputs.sha }}"

      # 前面的检查失败时，风险等级与证据仍要生成，评审才看得到全貌。
      - name: Risk level
        id: risk
        if: ${{ !cancelled() }}
        run: python .harness/engine/cli.py risk --base "${{ steps.base.outputs.sha }}" --github

      # 声明 R1 时，改到的变异目标得分不得低于基线（未配置变异目标则无事可做）。
      - name: Mutation score of changed targets (R1 claims)
        if: ${{ !cancelled() && steps.risk.outputs.claimed_r1 == 'true' }}
        run: python .harness/engine/cli.py mutate --check --changed-since "${{ steps.base.outputs.sha }}"

      # 实现任务书的 PR：归属 trailer 与运行记录（只报告；是否自动合并由 auto-merge 的 policy 判定）。
      - name: Run record (task PRs)
        if: ${{ !cancelled() }}
        run: python .harness/engine/cli.py run-check --base "${{ steps.base.outputs.sha }}" --github

      - name: Fix evidence
        if: ${{ !cancelled() }}
        run: python .harness/engine/cli.py evidence --base "${{ steps.base.outputs.sha }}" --markdown "$GITHUB_STEP_SUMMARY"

      - name: Delivery metrics
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .harness/engine/cli.py metrics --base "${{ steps.base.outputs.sha }}" --github --markdown "$GITHUB_STEP_SUMMARY"

      # 事件导出与 summary 是观察旁路（设计 2.5、4）：判定失败也要执行并上传，供事后 trace --ci 导入；
      # 观察自身失败不改变 job 结果（continue-on-error），也不替换上面各步骤自己写入的 summary 内容。
      # 临时事件库在 git 公共目录（.git/harness/），上传的只有导出的 JSON 包与 manifest 内的安全内容产物。
      - name: Export harness events
        if: ${{ always() }}
        continue-on-error: true
        run: python .harness/engine/reports/ci_events.py export --target "$RUNNER_TEMP/harness-events"

      # 逻辑名 harness-events；物理名带 run/attempt/job 唯一后缀（下载侧 load_ci 按它核对），保留 90 天。
      - name: Upload harness events
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: harness-events-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ runner.temp }}/harness-events
          retention-days: 90

      - name: Harness event summary
        if: ${{ always() }}
        continue-on-error: true
        run: >-
          python .harness/engine/reports/ci_events.py summary
          --bundle "$RUNNER_TEMP/harness-events/harness-events.json" >> "$GITHUB_STEP_SUMMARY"

      # 合并后 GitHub 事实同步（观察旁路，设计 3.5）：push 到 main 的合并提交（手工与 App 合并都经此
      # 路径，不靠 auto-merge job 独占触发）后，从 API 取回批准者/合并者/方式/标签、抽审与 escape 事实
      # 写成事件，归属 PR 的 headRefName。只读查询：不做任何合并/批准/推送动作；缺批准记 none，无法
      # 确定的合并方式记 unknown；API 失败明确报告事实缺失也不伪造。自身失败被 continue-on-error 隔离。
      # 非 push 事件（PR 分支）尚未合并、无事实可同步：脚本内显式跳过，本步骤仍执行且成功。
      - name: Sync GitHub facts
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "not a push (no merge commit), nothing to sync"
            exit 0
          fi
          python .harness/engine/reports/github_events.py --head "$GITHUB_SHA"
