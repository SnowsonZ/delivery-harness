name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Lint
        run: |
          python -m pip install --quiet ruff==0.16.8
          python -m ruff check engine tests

      - name: Tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
