# 可验证交付 harness 的规则（docs/plans/verifiable-delivery.md）。
# 改动本文件、harness/ 下任何代码或 .githooks/ 都属于 R3（护栏本身），必须由用户批准。

[hygiene]
# 已跟踪文件或暂存区命中即失败（v0.8.0 R1：真实快照与编译产物进入公开仓库）。
forbidden = [
    "scratch/**",
    "build/**",
    "widget/**",
    "**/*.o",
    "**/*.sqlite",
    "**/*.sqlite-wal",
    "**/*.sqlite-shm",
    "**/snapshot.json",
    ".zcode/**",
    ".codex/**",
    ".agents/**",
    ".venv/**",
    "**/__pycache__/**",
    "**/*.pyc",
    "**/.DS_Store",
]
# 命中 forbidden 但允许入库的具体文件（逐个列出，不用通配）。
# .zcode/、.codex/ 下可能有运行数据，只有项目级守卫配置入库（docs/specs/delivery-harness.md §4）。
allowed = [".zcode/config.json", ".codex/hooks.json"]
max_file_kb = 1024
# 新增行命中即失败：凭据。
secret_patterns = [
    'ghp_[A-Za-z0-9]{30,}',
    'github_pat_[A-Za-z0-9_]{40,}',
    'sk-[A-Za-z0-9_-]{32,}',
    'AKIA[0-9A-Z]{16}',
    'xox[baprs]-[A-Za-z0-9-]{10,}',
    '-----BEGIN [A-Z ]*PRIVATE KEY-----',
]
# 新增行命中即失败：本机真实路径（隐私）。夹具请用占位用户名。
home_path_pattern = '/Users/(?!(x|you|me|user|name|example|test|someone)/)[A-Za-z0-9._-]+/'

[risk]
# 按改动路径取最高等级；未命中任何规则的路径按 R2 处理。
# R3：护栏、CI 与发布、报告迁移与重写、隐私、用户配置安装、运行时入口。
r3 = [
    ".github/**",
    ".githooks/**",
    ".claude/**",
    ".opencode/**",
    ".pi/**",
    ".zcode/**",
    ".codex/**",
    "harness/**",
    "bin/**",
    "evals/review/samples.json",
    "requirements*.txt",
    "scripts/build_inbox_app.py",
    "scripts/migrations.py",
    "scripts/capture_hook.py",
    "scripts/session_binding.py",
    "native/WidgetSnapshotWriter.swift",
    "native/Shared/WidgetSnapshot.swift",
    "ruff.toml",
    ".gitignore",
]
# R2：产品代码与现役合同。
r2 = [
    "scripts/**",
    "native/**",
    "docs/specs/**",
    "AGENTS.md",
    "LICENSE",
]
# R0：说明性文档。测试目录单独判定（只新增为 R0，改动或删除已有测试升为 R2 并标记）。
r0 = [
    "docs/plans/**",
    "docs/research/**",
    "docs/review/**",
    "docs/decisions/**",
    "docs/images/**",
    "docs/runs/**",
    "evals/review/results/**",
    "README.md",
    "README.zh-CN.md",
]
tests = ["tests/**"]
# 合同：模板与待办清单须经用户审（2026-09-28 决定 1），先于 r0 判定。
contracts = [
    "docs/templates/**",
    "docs/plans/backlog.md",
]
# 任务书按类别判定（2026-09-28 决定 1，harness/taskbook.py）：K7、K8 与 architecture: true 的任务书、
# 头部不合格或删除任务书为 R2；其余（业务修改、缺陷修复等）为 R0，准入由 CI 中的 verify 检查。
# 类别写低不影响安全：实现 PR 仍按实际改动路径判级。
taskbooks = ["docs/plans/task-*.md"]
# 只能缩减的清单：只删不增时按 R0（关闭缺口是期望的方向）；有新增行仍按上面的规则判定。
shrink_only = ["harness/acceptance-gaps.txt", "harness/taskbook-exempt.txt"]
# 黄金快照：任何改动都意味着行为变化，不能算 R1。
golden = ["tests/golden/**"]

[taskbook]
# 任务书准入检查（harness/taskbook.py）对「步骤与提交顺序」中列出的文件做交叉核对。
# 触及这些路径的任务属护栏与流程类（K7）。
guard_paths = [
    ".github/**",
    ".githooks/**",
    ".claude/**",
    ".opencode/**",
    ".pi/**",
    ".zcode/**",
    ".codex/**",
    "harness/**",
    "bin/verify",
    "bin/as-agent",
    "bin/dispatch",
    "ruff.toml",
]
# 架构级：数据迁移、新增依赖、公共接口（CLI 输出由黄金快照固定，快照格式）。
architecture_paths = [
    "scripts/migrations.py",
    "requirements*.txt",
    "tests/golden/**",
    "native/Shared/WidgetSnapshot.swift",
]
# 模块：步骤涉及两个及以上模块即为架构级（「两个以上」含两个）。
[taskbook.modules]
python = ["scripts/**"]
native = ["native/**"]
cli = ["bin/session-manager"]

[dispatch]
# 派发脚本（harness/dispatch.py，bin/dispatch）：仓库同级的固定槽位数、卡死判定与等待 CI 的上限。
slots = 3
stall_minutes = 15
ci_timeout_minutes = 60

[review]
# 独立评审（harness/review.py）：默认评审方与各评审方的模型、超时。
# 用户 2026-09-28 指定：默认由 Pi（glm-5.3）评审；Codex 可选（gpt-6-sol、max）。
# 换评审方、模型或推理强度后须在校准集上重跑 TPR、TNR 再比较（设计 8.3）。
reviewer = "pi"
pi_model = "zai-coding-cn/glm-5.3"
codex_model = "gpt-6-sol"
codex_reasoning_effort = "max"
timeout_minutes = 30

[guard]
# git 层守卫（.githooks → harness/git_guard.py）。以下操作被拒绝，除非人显式设置覆盖变量：
#   在保护分支上提交、推送保护分支      HARNESS_ALLOW_MAIN=1
#   推送 tag（发版由用户执行）          HARNESS_ALLOW_TAG=1
#   本地改写或删除保护分支、移动或删除 tag、强制推送   HARNESS_ALLOW_REWRITE=1
#   pre-push 前跳过 verify              HARNESS_SKIP_VERIFY=1
# Agent 层守卫会拒绝设置这些变量的命令：覆盖只属于人。
protected_branches = ["main"]
